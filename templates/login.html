{% extends "base.html" %}

{% block title %}Access Login — FakeGuard AI{% endblock %}

{% block content %}

<div class="auth-wrapper" data-aos="zoom-in">
    <div class="glass-card no-hover auth-card">
        <div class="auth-header">
            <i class="fas fa-shield-halved auth-icon"></i>
            <h2>Platform Authentication</h2>
            <p class="text-muted">Enter credentials to access your verification workspace</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST" class="auth-form mt-3">
            
            <div class="form-group">
                <label for="login_id">Username or Email</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-user input-icon-inner"></i>
                    <input type="text" name="login_id" id="login_id" placeholder="name@domain.com or username" required class="form-control-icon">
                </div>
            </div>

            <div class="form-group mt-2">
                <label for="password">Password</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-lock input-icon-inner"></i>
                    <input type="password" name="password" id="password" placeholder="••••••••" required class="form-control-icon">
                    <button type="button" class="password-toggle-btn" id="pwToggle" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-options mt-2">
                <label class="checkbox-container">
                    <input type="checkbox" name="remember" id="remember">
                    <span class="checkmark"></span>
                    Remember me
                </label>
                <a href="#" class="forgot-pw-link" onclick="alert('Password recovery is not implemented in this demo. Contact Admin.');">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block mt-3">
                <i class="fas fa-right-to-bracket"></i> Sign In to Account
            </button>
        </form>

        <div class="auth-footer mt-4">
            <p>New to the platform? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
